groups:
  - name: service_alerts
    rules:
      - alert: ServiceInitializationTime
        expr: histogram_quantile(0.95, sum(rate(service_initialization_time_seconds_bucket[5m])) by (le, instance)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service initialization time exceeded"
          description: "The service initialization time has exceeded 2 seconds. {{ $labels.instance }} : {{ $value }} seconds"

  - name: request_alerts
    rules:
      - alert: HighRequestRate
        expr: endpoint:http_requests_total:max > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High request rate detected"
          description: "The request rate has exceeded 100 requests per minute. {{ $labels.endpoint }} : {{ $value }} requests/min"
  
      - alert: HighRequestLatency
        expr: instance_endpoint:http_requests_latency_seconds:avg > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected"
          description: "The 95th percentile request latency has exceeded 1 second. {{ $labels.instance }} - {{ $labels.endpoint }} : {{ $value }} seconds"
      
      - alert: HighErrorRate
        expr: instance_endpoint_status:http_requests:error_rate_5m > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "The error rate has exceeded 5%. {{ $labels.instance }} - {{ $labels.endpoint }} : {{ $value }}"