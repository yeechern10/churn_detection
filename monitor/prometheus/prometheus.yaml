global:
  scrape_interval: 5s
  evaluation_interval: 15s


scrape_configs:
  - job_name: "churn_detection"
    static_configs:
      - targets: ["api:8000"]
  
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "dcgm_exporter"
    static_configs:
      - targets: ["dcgm-exporter:9400"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yaml"
